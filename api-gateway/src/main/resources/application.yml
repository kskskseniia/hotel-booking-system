spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: hotel-service
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels/**
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**
              filters:
                - StripPrefix=2

server:
  port: 8080

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
