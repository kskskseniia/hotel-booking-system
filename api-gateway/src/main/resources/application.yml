spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: hotel-service
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels/**
            - id: hotel-service-create-room
              uri: lb://hotel-service
              predicates:
                - Path=/api/rooms
                - Method=POST
            - id: hotel-service-list-rooms
              uri: lb://hotel-service
              predicates:
                - Path=/api/rooms
                - Method=GET
            - id: hotel-service-recommend-rooms
              uri: lb://hotel-service
              predicates:
                - Path=/api/rooms/recommend
                - Method=GET
            - id: booking-service-create
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings
                - Method=POST
              filters:
                - SetPath=/booking
            - id: booking-service-history
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings
                - Method=GET
              filters:
                - SetPath=/bookings
            - id: booking-service-room-history
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/rooms/{roomId}
                - Method=GET
              filters:
                - SetPath=/bookings/rooms/{roomId}
            - id: booking-service-item
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/{id}
              filters:
                - SetPath=/booking/{id}

server:
  port: 8080

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
