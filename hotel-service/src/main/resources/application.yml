spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:h2:mem:hoteldb
    username: sa
    password:
  h2:
    console:
      enabled: ${HOTEL_H2_CONSOLE_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  address: 127.0.0.1
  port: 8081

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
